name: Deploy API

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync source to VPS
        run: |
          rsync -az --delete \
            --exclude node_modules \
            --exclude .env \
            --exclude uploads \
            --exclude logs \
            --exclude "*.log" \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new" \
            ./ "root@${{ secrets.VPS_HOST }}:/opt/realestate/server/"

      - name: Install dependencies & reload PM2
        run: |
          ssh -i ~/.ssh/id_ed25519 "root@${{ secrets.VPS_HOST }}" \
            "cd /opt/realestate/server && npm ci --omit=dev --no-audit --no-fund && \
             node scripts/migrate.js && \
             (pm2 describe edge-api >/dev/null 2>&1 && pm2 reload edge-api --update-env || pm2 start ecosystem.config.js) && \
             pm2 save"

      - name: Deploy summary
        run: echo "API deployed to https://edgemilerealty.tech/api/v1"
